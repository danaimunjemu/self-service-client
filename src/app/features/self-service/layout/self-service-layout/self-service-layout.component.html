<div class="app-background">
  <div class="app-container">
    <nav
      [class.navbar-transparent]="!isScrolled"
      [class.navbar-solid]="isScrolled"
      class="navbar navbar-expand-lg navbar-transparent"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="/assets/images/brand/afcholdings.png"
            alt=""
            style="max-width: 120px; margin-left: 10px;"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span>
            <svg xmlns="http://www.w3.org/2000/svg" width="1.4em" height="1.4em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5h12M4 12h16M4 19h8" color="currentColor"/></svg>
          </span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul
            class="navbar-nav me-auto mb-2 mb-lg-0 d-flex justify-content-center w-100" style="color: white;"
          >
            <!-- <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">FAQ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact Us</a>
            </li> -->
          </ul>
          <div class="d-flex nav-buttons-section">
               <afc-button
              class="me-2"
                [label]="'Apply for a Loan'"
                [disableButton]="false"
                [loading]="false"
                (buttonClick)="showLoansModal()"
                [style]="'primary'"
                [size]="'sm'"
              />
<!--            <afc-button-->
<!--              class="me-2"-->
<!--                [label]="'Insurance Onboarding'"-->
<!--                [disableButton]="false"-->
<!--                [loading]="false"-->
<!--                (buttonClick)="navigateTo('insurance-application')"-->
<!--                [style]="'primary'"-->
<!--                [size]="'sm'"-->
<!--              />-->
            <afc-button
              class="me-2"
              [label]="'New Pos Request'"
              [disableButton]="false"
              [loading]="false"
              (buttonClick)="navigateTo('posman-merchant-onboarding')"
              [style]="'primary'"
              [size]="'sm'"
            />

            <afc-button
              [label]="'Open New Account'"
              [disableButton]="false"
              [loading]="false"
              (buttonClick)="navigateTo('open-new-account')"
              [style]="'primary'"
              [size]="'sm'"
            />
          </div>
        </div>
      </div>
    </nav>
    <div>
      <router-outlet />
    </div>
  </div>
</div>

<nz-modal
  [(nzVisible)]="isLoansVisible"
  [nzTitle]="modalLoansTitle"
  [nzContent]="modalLoansContent"
  [nzFooter]="modalLoansFooter"
  (nzOnCancel)="handleLoansCancel()"
>
  <ng-template #modalLoansTitle></ng-template>

  <ng-template #modalLoansContent>
  <p>Please select the correct option</p>
    <button nz-button (click)="navigateTo('loan-application')" nzType="primary">I am an AFC Client</button>
    <button nz-button (click)="navigateTo('loan-application-non-afc')" nzType="default">I don't have an AFC Account</button>
  </ng-template>

  <ng-template #modalLoansFooter>
  </ng-template>
</nz-modal>
